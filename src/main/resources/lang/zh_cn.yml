# ==========================================
#          Quest 任务系统全局语言配置
#   延续全服统一视觉色系，使用 MiniMessage
# ==========================================
schema-version: 1

# 任务日志与玩家个人显示偏好。
journal:
  loading: '<#89F7FE>正在读取任务日志…'
  empty: '<#94A3B8>此分类暂无已配置的任务。'
  browse: '<#94A3B8>悬停查看说明，点击选择章节或任务。'
  no-selection: '<#94A3B8>暂无任务'
  tracked: '<#89F7FE>正在追踪'
  not-tracked: '<#94A3B8>未追踪'
  track-unavailable: '<#FFB75E>当前只可追踪进行中的任务，请重新选择。'
  saved: '<#A8FF78>显示设置已保存。'
  enabled: '<#A8FF78>开启'
  disabled: '<#94A3B8>关闭'
  mode-ALWAYS: '<#89F7FE>常驻'
  mode-OFF: '<#94A3B8>关闭'
  category-MAIN: '<#89F7FE>主线任务'
  category-SIDE: '<#A8FF78>支线任务'
  category-SPECIAL: '<#C4B5FD>特殊任务'

# HUD 动态文案；布局、字体与图片仅保存在服务端 Xerr 文件夹。
hud:
  personal: '个人引导任务'
  shared: '空岛成员共享进度'
  task-complete: '任务完成'
  chapter-complete: '章节完成'
  task-detail: '查看右侧任务栏，继续旅程'
  chapter-detail: '新的旅程正在等待'
  next: '下一任务：{next}'
  help: '查看右侧任务栏'

# TAB 左侧任务栏；实际任务名称、目标与操作说明来自原任务配置。
tab:
  loading: '<#C2E9FB>正在读取空岛任务…'
  no-island: '<#FFD700>下一步：创建或加入空岛，继续后续任务。'
  no-permission: '<#FFB75E>暂无任务查看权限。'
  unavailable: '<#FFB75E>空岛服务尚未就绪，请稍候。'
  error: '<#FFB75E>任务暂时无法读取，稍后自动重试。'
  done: '<#86EFAC><bold>当前任务全部达成</bold>，继续建设你的空岛吧！'
  waiting: '<#C2E9FB>正在等待下一项任务解锁。'
  state-line: '<#C2E9FB><value>'
  chapter-line: '<#94A3B8><chapter>'
  quest-line: '<#FBBF24><bold><quest></bold>'
  objective-line: '<#94A3B8>目标  <#E2E8F0><objective>'
  progress-line: '<#94A3B8>进度  <#67E8F9><bold><progress> / <target></bold>'
  objectives-line: '<#94A3B8>已达成目标  <#67E8F9><bold><completed> / <total></bold>'
  hint-line: '<#67E8F9><bold><step>.</bold> <#E2E8F0><hint>'
  shared-line: '<#A6B5CC>空岛成员共享任务进度'
automatic-rewards: '<#89F7FE>任务进度会自动追踪，<#A8FF78>完成奖励自动发放<#89F7FE>，无需打开任务菜单。'

# ── 错误与限制提示 (柔和珊瑚红 #FF6B6B + 冰晶白 #E0F7FA) ──
no-permission: '<#FF6B6B>✖ <#E0F7FA>你没有使用此功能的权限。'
unavailable: '<#FF6B6B>✖ <#E0F7FA>相关插件或物品数据尚未就绪，请稍后再试。'
error: '<#FF6B6B>✖ <#E0F7FA>操作未能完成，请联系管理员查看 Quest 日志。'
player-only: '<#FF6B6B>✖ <#E0F7FA>该操作仅限玩家在游戏内打开任务中心。'

# ── 警告与状态提示 (暖金 #FFB75E / 冰蓝 #89F7FE + 冰晶白 #E0F7FA) ──
no-island: '<#FFB75E>⚠ <#E0F7FA>请先创建或加入一个专属家园空岛。'
loading: '<#89F7FE>⏳ <#C2E9FB>正在读取家园任务数据，请稍候…'
busy: '<#FFB75E>⏳ <#E0F7FA>操作正在处理中，请勿频繁点击。'
not-complete: '<#FFB75E>✖ <#E0F7FA>该任务尚未完成、奖励已领取，或当前状态不支持此操作。'
inventory-full: '<#FFB75E>⚠ <#E0F7FA>背包空间不足！奖励已安全保留，腾出空位后会自动发放。'
uncertain: '<#FFB75E>⚠ <#E0F7FA>存在发放结果待核对的奖励，请联系管理员使用 <#FFF9C4>/quest admin debug <#E0F7FA>核实。'

# ── 成功与进度提示 (薄荷绿 #A8FF78 / 冰蓝 #89F7FE + 冰晶白 #E0F7FA) ──
claimed: '<#A8FF78>✔ <#E0F7FA>任务奖励正在自动发放。'
delivered: '<#A8FF78>✔ <#E0F7FA>任务奖励已成功发放至你的背包。'
progress: '<#89F7FE>✦ <#C2E9FB>任务进度更新：<#FFFFFF><quest>'
complete: '<#A8FF78>✦ <#E0F7FA>任务达成：<#78FFD6><quest><#E0F7FA>！奖励会自动发放。'

# ── 管理与调试指令 ──
reloaded: '<#A8FF78>✔ <#E0F7FA>Quest 任务配置文件已成功重载。'
reset: '<#A8FF78>✔ <#E0F7FA>任务进度已重置（历史领奖记录已保留，防止重复刷取奖励）。'
usage: '<#FFB75E>✦ <#E0F7FA>用法：<#FFF9C4>/quest admin reload <#7F8C8D>| <#FFF9C4>reset 〈空岛UUID〉 〈任务ID〉 <#7F8C8D>| <#FFF9C4>debug 〈空岛UUID〉 <#7F8C8D>| <#FFF9C4>resolve 〈奖励UUID〉 delivered/retry'
debug: '<#89F7FE>ℹ <#E0F7FA><info>'
resolved: '<#A8FF78>✔ <#E0F7FA>发放核对结果已成功保存至审计记录。'

# ── GUI 面板条目格式 (统一 ▪ 前缀与高亮配色) ──
reward-line: ' <#FFB75E>▪ <#FFE0B2>奖励数量：<#FFD700><amount>'
objective-line: ' <#89F7FE>▪ <#E0F7FA><description> <#A8FF78><progress><#7F8C8D>/<#89F7FE><target>'

status:
  LOCKED: '<#7F8C8D>🔒 未解锁'
  ACTIVE: '<#89F7FE>⏳ 进行中'
  COMPLETE: '<#A8FF78>✦ 已完成'
  CLAIMED: '<#90A4AE>✔ 已领取'

chapter-status:
  LOCKED: '<#7F8C8D>🔒 未解锁'
  ACTIVE: '<#89F7FE>⏳ 进行中'
  COMPLETE: '<#A8FF78>✔ 已完成'

chapter-progress: ' <#89F7FE>▪ <#C2E9FB>章节进度：<#A8FF78><progress><#7F8C8D>/<#89F7FE><target>'
chapter-reward-status: ' <#FFB75E>▪ <#FFE0B2>章节奖励：<status>'

# ── 屏幕 Title 与聊天播报通知 ──
notices:
  chapter-start:
    message: '<#FFB75E>✦ <#E0F7FA>新章节已开启：<#FFD700><chapter>'
    title: '<#FFB75E>✦ <#FFD700><bold><chapter></bold> <#FFB75E>✦'
    subtitle: '<#89F7FE>▪ <#E0F7FA>新的空岛旅程开始了'
  task-start:
    message: '<#89F7FE>✦ <#E0F7FA>新任务已解锁：<#78FFD6><quest>'
    title: '<#89F7FE>✦ <#E0F7FA><bold><quest></bold>'
    subtitle: '<#C2E9FB>新的目标已解锁'
  task-complete:
    message: '<#A8FF78>✔ <#E0F7FA>任务完成：<#FFD700><quest><#E0F7FA>，奖励会自动发放。'
    title: '<#A8FF78>✦ <#78FFD6><bold>任 务 完 成</bold> <#A8FF78>✦'
    subtitle: '<#FFD700><quest>'
  next-task:
    message: '<#89F7FE>▶ <#E0F7FA>下一阶段任务已解锁：<#78FFD6><quest>'
    title: '<#89F7FE>✦ <#E0F7FA><bold><quest></bold>'
    subtitle: '<#C2E9FB>新的目标已解锁，继续前进吧'
  chapter-complete:
    message: '<#FFB75E>🎉 <#E0F7FA>恭喜完成章节：<#FFD700><chapter><#E0F7FA>！章节奖励会自动发放。'
    title: '<#FFB75E>✦ <#FFD700><bold>章 节 完 成</bold> <#FFB75E>✦'
    subtitle: '<#78FFD6><chapter>'

# 文字任务栏；旧 smart / always 指令保持兼容，显示方式统一为常驻。

# 玩家与管理员指令帮助。
command-help:
  player: '<#DDB66D>Quest 帮助<newline><#EEF3F5>/quest <#A6B2C0>打开任务日志、章节总览和个人设置<newline><#EEF3F5>/quest help <#A6B2C0>查看帮助；任务自动推进，奖励自动发放。'
  admin: '<#DDB66D>Quest 管理<newline><#EEF3F5>/quest reload <#A6B2C0>重载配置<newline><#EEF3F5>/quest admin debug [空岛UUID] <#A6B2C0>查看任务与奖励状态<newline><#EEF3F5>/quest admin reset 〈空岛UUID〉 〈任务ID〉 <#A6B2C0>重置进度<newline><#EEF3F5>/quest admin resolve 〈奖励UUID〉 delivered|retry <#A6B2C0>核对异常奖励'

# 个人交谈任务；不发奖励，不改变空岛团队任务结算。
introduction:
  actionbar: '<#FFD700>✦ 当前任务：<#E0F7FA>右键大厅中的引航员交谈 <#A6B2C0>｜ <#C2E9FB>查看右侧任务栏'
  task-name: '<#FFD700>初见引航员'
  objective: '<#E0F7FA>与引航员交谈'
  hints:
    - '<#C2E9FB>右键大厅中的引航员'
    - '<#C2E9FB>查看右侧任务栏与操作提示'
  dialogue:
    - '<#FFD700>✦ 引航员 <#E0F7FA>欢迎来到星辰，这里是你旅程的起点。'
    - '<#E0F7FA>右侧任务栏会显示当前目标、进度和操作步骤。'
    - '<#C2E9FB>基岩版可直接阅读这段聊天引导，用蹲下键确认交谈。'
    - '<#E0F7FA>你可以创建自己的空岛，也可以加入好友的空岛。'
    - '<#E0F7FA>准备好后，再次右键我打开空岛面板。入岛领取生成器，放置后获得燃料，再为它添加燃料。'
  confirm: '<#A8FF78>蹲下确认交谈 <#A6B2C0>｜ <click:run_command:''/quest guide skip''><#FFD700>[跳过引导]</click>'
  fallback-confirm: '<click:run_command:''/quest guide finish''><#A8FF78>[点击完成交谈]</click><#A6B2C0> 或输入 /quest guide finish；跳过：/quest guide skip'
  complete: '<#A8FF78>✔ 交谈完成。<#E0F7FA>查看右侧任务栏；再次右键引航员打开空岛面板。'
  interrupted: '<#A6B2C0>交谈已中断，进度保留。再次右键引航员即可重新交谈。'
  no-dialogue: '<#A6B2C0>当前没有等待确认的聊天引导，请先右键引航员。'
  npc-unavailable: '<#C2E9FB>请右键大厅中的引航员开始交谈；若NPC不可用，可用 /quest guide skip 跳过。'
  help: '<#DDB66D>引导帮助<newline><#EEF3F5>/quest guide skip <#A6B2C0>跳过个人引导<newline><#EEF3F5>/quest guide replay <#A6B2C0>完成后重看对话<newline><#EEF3F5>/quest guide finish <#A6B2C0>确认聊天降级引导'
