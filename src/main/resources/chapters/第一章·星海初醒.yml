# ==========================================
#          第一章：星海初醒 (章节配置)
#   ID 永久稳定；文本使用全服统一 MiniMessage 色系
# ==========================================
schema-version: 2
id: sky_awakening

# 章节名称：使用暖金章节标识搭配亮金加粗主标题
name: '<#FFB75E>✦ <#FFD700><bold>第一章 · 星海初醒</bold>'

icon: minecraft:ender_eye
order: 1

# 章节简述 (用于章节列表悬浮展示)
description:
  - ' <#89F7FE>▪ <#E0F7FA>在无垠星海中唤醒一座属于你们的空岛'
  - ' <#89F7FE>▪ <#C2E9FB>扬帆启航、注入能源，收获第一批基础物资'

# 章节背景故事 (用于详情展开或引导展示)
story:
  - ' <#7F8C8D>❖ <#90A4AE>星海深处，一座沉睡的岛屿正等待你们唤醒。'
  - ' <#7F8C8D>❖ <#90A4AE>点亮第一台生成器，让空岛文明从第一块原石开始。'

# 章节前置使用 prerequisites 引用章节 ID；省略表示无前置。
# tasks 顺序仅控制展示。requires 全部完成才解锁；只写前置，后续自动推导。
tasks:
  - quest: sky_start
  - quest: first_fuel
    requires:
      - sky_start
  - quest: first_resources
    requires:
      - first_fuel

# 独立于任务奖励，每个空岛只可领取一次。
rewards:
  - item: minecraft:diamond
    amount: 2