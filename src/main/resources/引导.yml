# 第一章的个人前置任务：首次交互打开空岛界面即可完成，无需先创建或加入空岛。
# 首次交互前每秒刷新 ActionBar；打开界面并保存完成后停止。
# 不参与空岛共享奖励结算。
schema-version: 1
enabled: true
# Adyeshach 编辑器中的 NPC 编号（id），不是名称、坐标或运行时实体数字。
# 已绑定本服现有 NPC，不修改它的名称、模型和位置。
npc-id: '新人'
chapter-id: 'sky_awakening'
# 永久进度键，修改会产生一个新的个人任务。
task-id: 'meet_guide'
# 兼容旧配置保留；首次交互已取消对话，此字段不再触发 Typewriter。
typewriter-entry-id: 'quest_guide_01'
# 兼容旧配置保留，当前不启动对话；单位秒，范围 15–600。
timeout-seconds: 120
