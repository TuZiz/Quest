# 章节任务列表；整行标记展开说明、要求和奖励，不打开任务详情页。
schema-version: 2
title: '<#7DD3FC>章节任务链'
unavailable-item: 'minecraft:barrier'
Shape:
- '####S###C'
- '#QQQQQQQ#'
- '#QQQQQQQ#'
- '#QQQQQQQ#'
- 'P###B###N'
components:
  '#':
    item: 'minecraft:gray_stained_glass_pane'
    name: ''
  S:
    item: 'minecraft:book'
    action: 'chapter-summary'
    name: '<chapter>'
    lore:
    - '<status>'
    - '<#CBD5E1>已完成任务：<progress>/<target>'
    - ''
    - '<#FFCC80>章节奖励'
    - '<rewards>'
  Q:
    item: 'minecraft:book'
    action: 'quest'
    name: '<quest>'
    lore:
    - '<status>'
    - '<description>'
    - ''
    - '<#89F7FE>完成要求'
    - '<objectives>'
    - ''
    - '<#A8FF78>任务奖励'
    - '<rewards>'
  C:
    item: 'minecraft:emerald'
    action: 'chapter-claim'
    name: '<#6EE7B7>领取章节奖励'
    lore:
    - '<#94A3B8>全部任务完成后自动发放，历史记录防止重复。'
    - ''
    - '<#FFCC80>章节奖励'
    - '<rewards>'
  B:
    item: 'minecraft:arrow'
    action: 'back'
    name: '<#CBD5E1>返回全部章节'
  P:
    item: 'minecraft:arrow'
    action: 'previous'
    name: '<#CBD5E1>上一页'
  N:
    item: 'minecraft:arrow'
    action: 'next'
    name: '<#CBD5E1>下一页'
player-access: false
reward-format: '<#FFCC80>▪ <reward> <#A8FF78>×<amount>'
