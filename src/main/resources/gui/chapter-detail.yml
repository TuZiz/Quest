schema-version: 1
title: '<#7DD3FC>章节任务链'
unavailable-item: minecraft:barrier
Shape:
  - '#########'
  - '#   S   #'
  - '#QQQQQQQ#'
  - '#VVVVVVV#'
  - '#PB C N W'
  - '#########'
components:
  '#':
    item: minecraft:gray_stained_glass_pane
    name: ''
  S:
    item: minecraft:book
    action: chapter-summary
    name: '<chapter>'
    lore:
      - '<status>'
      - '<#CBD5E1>已完成任务：<progress>/<target>'
  Q:
    item: minecraft:book
    action: quest
    name: '<quest>'
    lore:
      - '<status>'
      - '<#94A3B8>点击查看条件及任务奖励'
  V:
    item: minecraft:chest
    action: chapter-preview
  C:
    item: minecraft:emerald
    action: chapter-claim
    name: '<#6EE7B7>领取章节奖励'
    lore:
      - '<#94A3B8>全部任务完成即可领取，与任务领奖独立。'
  B:
    item: minecraft:arrow
    action: back
    name: '<#CBD5E1>返回全部章节'
  P:
    item: minecraft:arrow
    action: previous
    name: '<#CBD5E1>上一页'
  N:
    item: minecraft:arrow
    action: next
    name: '<#CBD5E1>下一页'
  W:
    item: minecraft:chest
    action: mailbox
    name: '<#FBBF24>领取待发奖励'
