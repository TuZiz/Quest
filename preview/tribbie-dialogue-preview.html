<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>缇宝 · 星辰引航员对话预览</title>
<style>
:root{--ink:#07111d;--panel:rgba(7,17,29,.86);--line:#5ed9cf;--cream:#f6ecd0;--muted:#a9c6c7;--gold:#f0c66b;--pink:#ef7da9;--red:#c94352;--blue:#9dd9ea}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#081321;color:var(--cream);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:22px}.stage{position:relative;width:min(1240px,96vw);aspect-ratio:16/9;overflow:hidden;background:linear-gradient(180deg,#f0a66b 0%,#cb7a87 30%,#344b77 63%,#0a1727 100%);box-shadow:0 18px 70px #000b;border:2px solid #263e59}.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 12% 18%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 28% 12%,#fff8 0 1px,transparent 2px),radial-gradient(circle at 67% 19%,#fff9 0 1px,transparent 2px),radial-gradient(circle at 84% 9%,#fff8 0 1px,transparent 2px),radial-gradient(circle at 92% 29%,#fff8 0 1px,transparent 2px);opacity:.7}.moon{position:absolute;right:11%;top:11%;width:8%;aspect-ratio:1;border-radius:50%;background:#f7dfb4;box-shadow:0 0 34px #f7dfb477}.island{position:absolute;background:#192d3e;border:3px solid #375469;clip-path:polygon(0 10%,80% 0,100% 18%,86% 38%,72% 100%,23% 83%,7% 52%);filter:drop-shadow(0 13px 8px #0008)}.island:after{content:"";position:absolute;inset:10% 16% 42%;background:#3d6c67;clip-path:polygon(0 20%,80% 0,100% 50%,35% 100%)}.i1{width:22%;height:14%;left:8%;top:30%;transform:rotate(-6deg)}.i2{width:19%;height:12%;right:7%;top:37%;transform:rotate(8deg)}.i3{width:32%;height:17%;left:35%;top:45%;transform:rotate(-2deg)}.lamp{position:absolute;left:59%;top:35%;width:7px;height:19%;background:#27394a;box-shadow:0 0 22px 8px #f4d37d}.dialogue{position:absolute;left:4%;right:4%;bottom:4%;height:29%;display:flex;gap:22px;padding:20px 28px 17px 18px;background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px #14333c,0 9px 24px #0009}.dialogue:before,.dialogue:after{content:"";position:absolute;width:12px;height:12px;border-color:var(--gold);border-style:solid}.dialogue:before{left:-2px;top:-2px;border-width:2px 0 0 2px}.dialogue:after{right:-2px;bottom:-2px;border-width:0 2px 2px 0}.portrait{position:relative;width:18%;min-width:128px;display:grid;place-items:end center;overflow:hidden}.portrait svg{height:116%;width:100%;image-rendering:pixelated;filter:drop-shadow(7px 7px 0 #0007)}.copy{flex:1;display:flex;flex-direction:column;min-width:0}.speaker{font-size:clamp(18px,2.1vw,30px);font-weight:800;letter-spacing:.12em;color:var(--gold);text-shadow:2px 2px #3d2412;margin-bottom:8px}.body{font-size:clamp(15px,1.55vw,23px);line-height:1.6;color:var(--cream);max-width:820px}.footer{margin-top:auto;display:flex;justify-content:flex-end;gap:26px;align-items:center;font-size:clamp(13px,1.25vw,18px);color:var(--muted)}.continue{color:var(--line);font-weight:800;letter-spacing:.08em}.progress{color:var(--gold);font-variant-numeric:tabular-nums}.hint{position:absolute;left:22px;top:-31px;font-size:12px;letter-spacing:.12em;color:#9fd7d4;background:#0a202a;border:1px solid #35646a;padding:6px 10px}.corner{position:absolute;right:14px;top:13px;color:#f5e6c2;font-size:12px;letter-spacing:.12em;opacity:.72}@media(max-width:700px){body{padding:8px}.dialogue{gap:8px;padding:12px 12px 10px 8px;height:34%}.portrait{min-width:90px;width:22%}.speaker{margin-bottom:3px}.body{line-height:1.4}.footer{gap:10px}.hint{display:none}}
</style>
</head>
<body>
<main class="stage" aria-label="缇宝星辰引航员对话窗口预览">
  <div class="stars"></div><div class="moon"></div><div class="island i1"></div><div class="island i2"></div><div class="island i3"></div><div class="lamp"></div>
  <div class="corner">星海初醒 · NPC 对话预览</div>
  <section class="dialogue">
    <div class="hint">MODEL PREVIEW · 缇宝</div>
    <div class="portrait" aria-label="缇宝像素风半身头像">
      <svg viewBox="0 0 140 170" role="img" aria-label="缇宝半身头像">
        <g shape-rendering="crispEdges">
          <path fill="#c94352" d="M26 42h88v58H26zM38 24h64v18H38zM47 14h46v10H47zM20 51h18v34H20zM102 51h18v34h-18z"/>
          <path fill="#ef7da9" d="M33 37h74v32H33zM27 67h24v20H27zM89 67h24v20H89z"/>
          <path fill="#f8dfd1" d="M42 48h56v54H42zM35 57h14v31H35zM91 57h14v31H91z"/>
          <path fill="#27364e" d="M51 65h12v12H51zM77 65h12v12H77zM62 87h16v7H62z"/>
          <path fill="#f4a8b5" d="M62 78h16v10H62z"/>
          <path fill="#9dd9ea" d="M33 100h74v36H33zM23 112h20v28H23zM97 112h20v28H97z"/>
          <path fill="#f6ecd0" d="M47 101h46v22H47z"/>
          <path fill="#d75279" d="M50 124h40v30H50zM31 137h20v19H31zM89 137h20v19H89z"/>
          <path fill="#f0c66b" d="M59 6h22v8H59zM53 14h34v6H53z"/>
          <path fill="#9dd9ea" d="M56 2h28v5H56z"/>
        </g>
      </svg>
    </div>
    <div class="copy"><div class="speaker">星辰引航员</div><div class="body">欢迎来到星海初醒。先建立你的空岛，再回来领取第一份指引。</div><div class="footer"><span class="continue">左键 继续</span><span class="progress">1 / 5</span></div></div>
  </section>
</main>
</body>
</html>
